* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

6bcf\u79d2\u62c9\u5f00\u7ea6 60px\uff0c\u51e0\u79d2\u5185\u7529\u6389 |\n| `escapeSpeed` | 260 px/s | \u88ab\u6251\u540e\u7684\u5168\u529b\u9003\u8d70\uff0c\u5168\u573a\u6700\u5feb |\n\n\u51e0\u4f55\u53c2\u7167\u4f20 `referenceWindow: pet?.window`\uff08\u8ddf\u968f\u725b\u6765\u6240\u5728\u5c4f\uff09\u3002`panicked` \u8ba1\u7b97\u5c5e\u6027\uff1a\u88ab\u725b\u6765\u76ef\u4e0a\uff08\u8fd8\u6ca1\u88ab\u6251\uff09\u65f6\u773c\u775b\u7d27\u5f20\u3001\u77b3\u5b54\u6536\u7f29\u540e\u779f\u3002\n\n# \u51fa\u573a\u4e0e hook\n\n* `canStart()`\uff1a\u8981\u6c42\u725b\u6765\u53ef\u89c1\u3001\u975e\u5b89\u9759\u671f\u2014\u2014\u8774\u8776\u53ea\u5728\u725b\u6765\u80fd\u4e92\u52a8\u65f6\u51fa\u573a\u3002\n* `onWillStart`\uff1a\u6bcf\u6b21\u51fa\u573a\u4ece `schemes` \u968f\u673a\u9009\u4e00\u79cd\u914d\u8272\uff08\u4e3b\u8272 / \u4e2d\u95f4\u8272\u5e26 / \u773c\u6591\u82af / \u8fdc\u7fc5\u6df1\u8272\u56db\u5143\u7ec4\uff0c\u5171 5 \u5957\uff1a\u5929\u84dd\u7c89\u5e26\u3001\u660e\u9ec4\u6a58\u5e26\u3001\u8584\u8377\u9ec4\u5e26\u3001\u7c89\u7ea2\u674f\u5e26\u3001\u7d2b\u7f57\u5170\u7c89\u5e26\uff09\uff0c\u91cd\u7f6e\u9003\u9038\u6807\u5fd7\u4e0e\u300c\u53ea\u88ab\u6251\u4e00\u6b21\u300d\u6807\u8bb0\u3002\n* `updatePosition`\uff1a\u5de1\u822a\u65f6\u6b63\u5f26\u8d77\u4f0f\u7ffb\u98de\uff1b`escaping` \u540e\u52a0\u901f\u5f80\u4e0a\u9003\u3002\n* `afterMove`\uff1a\u725b\u6765\u8fdb\u5165\u89e6\u53d1\u8ddd\u79bb\u56de\u8c03 `pet.startChasingButterfly()`\uff1b\u5feb\u5230\u5c4f\u5e55\u8fb9\u4e14\u6b63\u5728\u88ab\u8ffd\u56de\u8c03 `pet.pounceAtButterfly()`\uff08\u4e00\u6b21\u98de\u884c\u5404\u9650\u4e00\u6b21\u7684\u5224\u5b9a\u5728 hook \u5185\uff09\u3002\n* \u8ffd / \u6251\u7684\u725b\u6765\u4fa7\u72b6\u6001\u63a8\u8fdb\u5728[\u6838\u5fc3\u72b6\u6001\u673a](/pet/pet-view-model.md)\u7684 `chasing` / `pouncing` \u5206\u652f\u3002[^(vm-src)]\n\n`size: 110\u00d795`\uff1b\u5206\u5c42\u7fc5\u8180 + \u968f\u673a\u914d\u8272\u7ed8\u5236\u89c1 [ButterflyView](/views/drawing-conventions.md)\u3002[^(bfly-view)]\n\n[^bfly-src]: ButterflyController.swift\n[^bfly-view]: ButterflyView.swift\uff08\u5206\u5c42\u7fc5\u8180\uff09\n[^vm-src]: PetViewModel\uff08\u8ffd\u8774\u8776\u4e3b\u5faa\u73af\uff09", "controllers/companion-controller": "\u8c79\u62c9\u4e0d\u6a2a\u7a7f\u5c4f\u5e55\uff0c\u6709\u81ea\u5df1\u7684 60fps [FrameTicker](/core/frame-ticker.md) \u8ddf\u968f\u5faa\u73af\uff0c\u6240\u4ee5\u4e0d\u8d70 [ScreenCrosser](/controllers/screen-crosser.md)\u3002\u7a97\u53e3 200\u00d7250\uff0c\u54cd\u5e94\u70b9\u51fb\uff08[\u6233\u8c79\u62c9\u6709\u4e13\u5c5e\u53f0\u8bcd](/pet/pet-phrases.md)\uff09\u3002[^(comp-src)]\n\n# \u767b\u573a / \u79bb\u573a\n\n* **\u968f\u673a\u5ba2\u4e32**\uff1a\u725b\u6765\u6bcf\u6b21\u5f00\u59cb\u6563\u6b65\u56de\u8c03 `onPetStartedWalking()`\uff0c\u300c\u5e38\u4f34\u300d\u5f00\u7740\u5fc5\u767b\u573a\uff0c\u5426\u5219 30% \u6982\u7387\uff1b\u4ece\u725b\u6765\u524d\u8fdb\u65b9\u5411\u7684**\u53cd\u4fa7**\u5c4f\u5e55\u8fb9\u7f18\u8dd1\u8fdb\u6765\u3002\n* **\u5e38\u4f34\u6a21\u5f0f**\uff08`Settings.baolaAlways`\uff0c\u9ed8\u8ba4\u5f00\uff09\uff1a\u83dc\u5355 Toggle / \u6a21\u5f0f\u53d8\u5316 / \u725b\u6765\u91cd\u65b0\u663e\u793a\uff08`setVisible`\uff0c\u4e14\u975e\u5b89\u9759\u671f\uff09\u90fd\u4f1a\u62c9\u5b83\u56de\u6765\u2014\u2014\u300c\u670b\u53cb\u5c31\u8be5\u8d34\u8eab\u6328\u7740\u8d70\u300d\u3002\n* **\u79bb\u5f00**\uff1a\u725b\u6765\u7761\u7740\u975e\u5e38\u4f34\u6a21\u5f0f 60% \u6982\u7387\u6084\u6084\u8d70\uff1b\u5207\u5de5\u4f5c / \u756a\u8304\u949f\u4e13\u6ce8\u5219\u9053\u522b\u300c\u4f60\u5fd9\u5427\uff0c\u6211\u6539\u5929\u518d\u6765\u627e\u725b\u6765\u73a9~\u300d\u3002\u79bb\u573a\u662f\u8d70\u5411\u6700\u8fd1\u5c4f\u5e55\u8fb9\u7f18\uff08320px/s\uff09\uff0c\u51fa\u754c\u624d\u771f\u6b63\u6d88\u5931\u3002\n\n# \u8ddf\u968f\u4e3b\u5faa\u73af\n\n* **\u76ee\u6807\u4f4d**\uff1a\u62a4\u536b\u4f4d\u4f18\u5148\uff0c\u5426\u5219\u725b\u6765\u8eab\u540e\u4e00\u4e2a\u8eab\u4f4d\u2014\u2014\u7a97\u53e3\u91cd\u53e0 110pt\uff1a\u4e24\u8fb9\u753b\u5e03\u8fb9\u7f18\u90fd\u662f\u900f\u660e\u7559\u767d\uff0c\u89c6\u89c9\u4e0a\u521a\u597d\u8d34\u8eab\u3002\n* **\u8fdf\u6ede\u9632\u6296**\uff1a\u8ddd\u79bb >12pt \u624d\u8d77\u8ddf\u3001<4pt \u624d\u505c\uff0c\u907f\u514d\u9608\u503c\u9644\u8fd1\u6765\u56de\u5207\u6362\u3002\n* **\u6bd4\u4f8b\u901f\u5ea6**\uff1a`min(340, max(30, |dx| * 4))`\u2014\u2014\u79bb\u5f97\u8fdc\u8dd1\u5f97\u5feb\uff0c\u63a5\u8fd1\u65f6\u5e73\u6ed1\u51cf\u901f\u5230\u4e0e\u725b\u6765\u540c\u901f\u3002\n* **\u5782\u76f4\u5e73\u6ed1\u8ddf\u968f**\uff1a`origin.y += (\u76ee\u6807 y - \u5f53\u524d y) * min(1, 6*dt)`\uff0c\u725b\u6765\u88ab\u62ce\u5230\u522b\u5904\u65f6\u8ddf\u4e0a\u53bb\u3002\n* \u9759\u6b62\u65f6**\u955c\u50cf\u72b6\u6001**\uff1a\u725b\u6765\u5750 / \u7761 / \u5f00\u5fc3\u5219\u8c79\u62c9\u540c\u6b3e\u59ff\u52bf\uff0c\u62a4\u536b\u65f6\u4fdd\u6301\u8b66\u89c9\u5f39\u8df3\uff08`.happy`\uff09\uff0c\u88ab\u6233\u6216\u725b\u6765\u5413\u4e00\u8df3\u6709 1.4~1.6s \u53cd\u5e94\u671f\u539f\u5730\u4e0d\u52a8\u3002\n\n# \u62a4\u536b\uff08\u72fc\u5f71\u4e8b\u4ef6\uff09\n\n`guardAgainst(fromLeft:)` \u8bbe\u5b9a `guardTargetX`\uff1a\u72fc\u4ece\u5de6\u6765\u6321\u725b\u6765\u5de6\u4fa7\uff08`minX - width - 4`\uff09\uff0c\u4ece\u53f3\u6765\u6321\u53f3\u4fa7\uff08`maxX + 4`\uff09\uff0c\u5192\u300c\u55f7\u545c\uff01\uff01\u6709\u6211\u5728\uff0c\u522b\u6015\uff01\u300d\uff1b\u72fc\u51fa\u5c4f `endGuard()` \u6e05\u9664\u3002\u8054\u52a8\u7f16\u6392\u89c1[\u5f69\u86cb\u8c03\u5ea6](/pet/events-scheduler.md)\u3002\n\n[^comp-src]: CompanionController.swift", "controllers/lark-controller": "# \u8c03\u5ea6\uff08\u72ec\u7acb\u4e8e\u57fa\u7c7b\u7684 eventTicker\uff09\n\n\u81ea\u5e26 `scheduleNext(after:)`\uff08`Timer` \u52a0\u8fdb RunLoop `.common`\uff0c\u83dc\u5355\u6253\u5f00\u4e5f\u7167\u5e38\u8d70\uff09\uff1a\u9996\u98de 3~8 \u5206\u949f\uff08demo 5 \u79d2\uff09\uff0c\u98de\u5b8c `onDidExit` \u6392\u4e0b\u4e00\u73ed 3~8 \u5206\u949f\uff08demo 30 \u79d2\uff09\u3002[^(lark-src)]\n\n`beginFlight()` \u524d\u7f6e\uff1a\u975e\u5b89\u9759\u671f\uff08\u5b89\u9759\u671f 2~4 \u5206\u949f\u540e\u518d\u6765\uff09\u3001\u725b\u6765\u53ef\u89c1\u3002\u98de\u884c\u9ad8\u5ea6\u968f\u673a\u53d6\u5c4f\u5e55\u9ad8\u5ea6\u7684 40%~70%\uff0c`flySpeed: 85`\uff08\u7fc5\u8180\u53d7\u8fc7\u4f24\uff09\u3002\n\n# \u6b47\u811a\u5b50\u72b6\u6001\u673a\uff08\u8986\u5199 updatePosition\uff09\n\n1. `onWillStart`\uff1a\u63b7\u7b7e `willPerch`\uff0830%\uff0cdemo \u5fc5\u4e2d\uff09\uff0c`perched = false`\u3002\n2. \u98de\u884c\u4e2d\u82e5 `willPerch` \u4e14\u63a5\u8fd1\u300c\u6b47\u811a\u4f4d\u300d\u2014\u2014\u725b\u6765\u7a97\u53e3\u9876\u90e8\u504f\u524d\uff08`midX - width/2`\uff0c`maxY - 40`\uff09\u2014\u2014\u843d\u5b9a\uff1a`perched = true`\uff0c`perchUntil = now + 20~60s`\u3002\n3. `perched` \u671f\u95f4\u6bcf\u5e27\u628a\u7a97\u53e3\u539f\u70b9\u5438\u9644\u5230\u725b\u6765\u5934\u9876\uff08\u8ddf\u7740\u725b\u6765\u8d70\uff0c\u725b\u6765\u88ab\u62ce\u8d70\u4e5f\u8ddf\u7740\uff09\u3002\n4. \u5230\u70b9\u8d77\u98de\uff0c`willPerch = false`\u2014\u2014**\u4e0d\u518d\u56de\u5934\u843d\u7b2c\u4e8c\u6b21**\u3002\n5. \u51fa\u5c4f `onDidExit` \u6392\u4e0b\u4e00\u73ed\u3002\n\n\u53d1\u5e03\u5c5e\u6027 `perched` \u4f9b [LarkView](/views/drawing-conventions.md) \u5207\u6362\u6536\u7fc5\u59ff\u52bf\u3002\n\n[^lark-src]: LarkController.swift", "controllers/screen-crosser": "# \u4e3a\u4ec0\u4e48\u7528\u57fa\u7c7b\u800c\u4e0d\u662f\u534f\u8bae\n\n\u534f\u8bae\u6269\u5c55\u7ed9\u4e0d\u4e86 `@Published` \u5b58\u50a8\u5c5e\u6027\uff0c\u6240\u4ee5\u7528 `@MainActor class ScreenCrosser: ObservableObject`\u3002\u53d1\u5e03\u7684\u5b57\u6bb5\uff1a`running`\uff08\u5728\u5c4f\u4e0a\uff09\u3001`facingLeft`\uff1b\u53e6\u6709 `onExit` \u4e00\u6b21\u6027\u51fa\u5c4f\u56de\u8c03\uff08\u8c03\u7528\u540e\u81ea\u52a8\u7f6e nil\uff09\u3002[^(crosser-src)]\n\n# \u6a21\u677f\u65b9\u6cd5\uff08final\uff0c\u4e0d\u53ef\u8986\u5199\uff09\n\n`startCrossing(fromLeft:groundY:referenceWindow:)` \u7684\u56fa\u5b9a\u6d41\u7a0b\uff1a\n\n1. `canStart()` \u68c0\u67e5\uff08\u8774\u8776\u8981\u6c42\u725b\u6765\u5728\u573a\u4e14\u975e\u5b89\u9759\u671f\uff09\uff0cfalse \u653e\u5f03\u3002\n2. `ensureWindow()`\u2014\u2014lazy \u521b\u5efa [\u60ac\u6d6e\u7a97](/core/window-factory.md)\uff0c\u6a2a\u7a7f\u7c7b\u4e00\u5f8b `ignoresMouseEvents: true` \u7eaf\u89c6\u89c9\u4e0d\u6321\u70b9\u51fb\u3002\n3. `referenceWindow` \u51b3\u5b9a\u51e0\u4f55\u53c2\u7167\uff08\u8774\u8776 / \u4e91\u96c0\u4f20\u725b\u6765\u7684\u7a97\u53e3\uff0c\u8ddf\u968f\u725b\u6765\u6240\u5728\u5c4f\uff09\u3002\n4. \u8bbe\u65b9\u5411\uff08`direction = \u00b11`\uff09\u3001`onWillStart` hook\u3001\u5165\u573a\u539f\u70b9\u3001`running = true`\u3001\u8d77 ticker\u3002\n\n\u6bcf\u5e27 `tick`\uff1a`updatePosition` hook \u79fb\u52a8 \u2192 `setFrameOrigin` \u2192 `afterMove` hook \u2192 \u51fa\u5c4f\u5224\u5b9a\uff08\u8d8a\u8fc7 `maxX+10` \u6216\u53f3\u8fb9\u754c\u5916 `minX-10`\uff09\u2192 `running=false`\u3001`orderOut`\u3001\u505c ticker\u3001`onDidExit()`\u3001\u89e6\u53d1 `onExit`\u3002\n\n# \u5b50\u7c7b hook \u6e05\u5355\n\n| hook | \u9ed8\u8ba4\u5b9e\u73b0 | \u8986\u5199\u8005 |\n|------|----------|--------|\n| `canStart()` | true | \u8774\u8776 |\n| `onWillStart(fromLeft:groundY:)` | \u7a7a | \u8774\u8776\uff08\u914d\u8272 / \u9003\u9038\u6807\u5fd7\uff09\u3001\u4e91\u96c0\uff08\u6b47\u811a\u610f\u613f\uff09 |\n| `startOrigin(fromLeft:vf:groundY:)` | \u5c4f\u5e55\u5916\u8d34\u5730 | \u2014 |\n| `updatePosition(dt:origin:vf:)` | \u76f4\u7ebf `direction * speed * dt` | \u8774\u8776\uff08\u7ffb\u98de / \u9003\u9038\uff09\u3001\u4e91\u96c0\uff08\u6b47\u811a\u8ddf\u968f\uff09 |\n| `afterMove(vf:)` | \u7a7a | \u8774\u8776\uff08\u89e6\u53d1\u8ffd / \u6251\uff09 |\n| `onDidExit()` | \u7a7a | \u4e91\u96c0\uff08\u6392\u4e0b\u4e00\u73ed\uff09 |\n| `makeContentView()` | EmptyView | \u56db\u4e2a\u5b50\u7c7b\u5404\u7ed9\u81ea\u5df1\u7684 View |\n\n\u5b50\u7c7b\u53ea\u9700\u7ed9\u51fa `speed` \u4e0e `size` \u5373\u53ef\u83b7\u5 llSpaces` + `.stationary`\uff09\uff0c\u60ac\u6d6e\u4e8e\u666e\u901a\u7a97\u53e3\u4e4b\u4e0a\u4e14\u6240\u6709\u684c\u9762\u7a7a\u95f4\u53ef\u89c1\u3002\n\n# \u542f\u52a8\u88c5\u914d\u6d41\u7a0b\n\n`NiulaiApp` \u7528 `@NSApplicationDelegateAdaptor` \u6302 `AppDelegate`\uff0c`applicationDidFinishLaunching` \u4e2d\u7684\u88c5\u914d\u987a\u5e8f[^(app-src)]\uff1a\n\n1. `NSApp.setActivationPolicy(.accessory)` \u2014\u2014 \u65e0 Dock \u56fe\u6807\u3001\u4e0d\u62a2\u7126\u70b9\u3002\n2. \u521b\u5efa [PetViewModel](/pet/pet-view-model.md) \u4e0e [PetWindowController](/pet/pet-window-controller.md)\uff08\u725b\u6765\u7a97\u53e3\uff09\u3002\n3. \u521b\u5efa\u8c79\u62c9 / \u4e91\u96c0 / \u86c7 / \u72fc / \u8774\u8776\u4e94\u4e2a\u63a7\u5236\u5668\uff0c\u4ee5 `weak` \u5f15\u7528\u4e92\u76f8\u63a5\u7ebf\uff08`pet.companion = companion`\u3001`butterfly.pet = pet` \u7b49\uff09\u2014\u2014\u6240\u6709\u8de8\u89d2\u8272\u8054\u52a8\uff08\u62a4\u536b\u3001\u8ddf\u968f\u3001\u5413\u4e00\u8df3\uff09\u90fd\u9760\u8fd9\u7ec4 weak \u5f15\u7528\u3002\n4. `controller.show()` \u2192 `pet.start()` \u2192 `lark.start()`\u3002\n5. \u82e5\u4e0a\u6b21\u300c\u8c79\u62c9\u5e38\u4f34\u300d\u5f00\u7740\u4e14\u5f53\u524d\u662f\u4f11\u95f2\u6a21\u5f0f\uff0c`companion.appear()` \u76f4\u63a5\u767b\u573a\u3002\n\n\u83dc\u5355\u680f\u662f `MenuBarExtra`\uff08`.menu` \u6837\u5f0f\uff09\uff0c\u56fe\u6807\u6587\u672c\u6765\u81ea `pet.menuBarLabel`\uff08\u756a\u8304\u949f\u8fd0\u884c\u65f6\u663e\u793a \ud83d\udc2e\ud83c\udf45 / \ud83d\udc2e\u2615\ufe0f / \ud83d\udc2e \u23f8\uff09\uff0c\u5185\u5bb9\u89c6\u56fe\u4e3a [MenuBarContentView](/views/menu-bar-content-view.md)\u3002\n\n# \u7ebf\u7a0b\u4e0e\u5e76\u53d1\u7ea6\u5b9a\n\n* \u5168\u90e8\u903b\u8f91\u5728\u4e3b\u7ebf\u7a0b\uff1a\u72b6\u6001\u673a\u3001\u63a7\u5236\u5668\u90fd\u6807 `@MainActor`\uff1bTimer \u95ed\u5305\u5185\u7528 `MainActor.assumeIsolated` \u6865\u63a5\u3002\n* `PetViewModel` \u4e0e `ScreenCrosser` \u7528 `nonisolated init() {}` \u89c4\u907f Swift \u5e76\u53d1\u68c0\u67e5\u4e0b\u7684\u521d\u59cb\u5316\u9694\u79bb\u95ee\u9898\u3002\n* \u6269\u5c55\u4e0d\u80fd\u6301\u6709\u5b58\u50a8\u5c5e\u6027\u2014\u2014\u756a\u8304\u949f\u3001\u5f69\u86cb\u3001\u7535\u91cf\u7b49\u8de8\u6269\u5c55\u5171\u4eab\u7684\u72b6\u6001\u5168\u90e8\u96c6\u4e2d\u5728 `PetViewModel.swift` \u4e3b\u6587\u4ef6\uff0c\u5e76\u7528\u6ce8\u91ca\u7ea6\u5b9a\u300cinternal: +Xxx \u5199\u300d\u6807\u6ce8\u5f52\u5c5e\u3002\u89c1[\u6838\u5fc3\u72b6\u6001\u673a](/pet/pet-view-model.md)\u7684\u5b58\u50a8\u5c5e\u6027\u6e05\u5355\u3002\n\n[^app-src]: NiulaiApp.swift\uff08\u5165\u53e3\u4e0e\u88c5\u914d\uff09\n[^readme]: \u4ed3\u5e93 README\uff08\u8bbe\u8ba1\u8bf4\u660e\uff09", "overview/mode-system": "# \u6a21\u5f0f\u5b9a\u4e49\n\n`PetMode` \u679a\u4e3e\u4e09\u4e2a\u53d6\u503c\uff08rawValue \u76f4\u63a5\u5b58 UserDefaults\uff09\uff1a\n\n| \u6a21\u5f0f | \u884c\u4e3a | \u8c79\u62c9 | \u5f69\u86cb\uff08\u86c7/\u72fc/\u8774\u8776/\u4e91\u96c0\uff09 |\n|------|------|------|--------------------------|\n| `.leisure` \u4f11\u95f2 | \u6ee1\u5730\u6f2b\u6e38\u3001\u53d1\u5446\u3001\u6253\u76f9 | \u53ef\u8ddf\u968f | \u6b63\u5e38\u51fa\u73b0 |\n| `.working` \u5de5\u4f5c | \u8d70\u5230\u53f3\u4e0b\u89d2\u8db4\u7761\u505a\u68a6 | \u9053\u522b\u79bb\u5f00 | \u5168\u90e8\u6682\u505c |\n| `.pomodoro` \u756a\u8304\u949f | \u4e13\u6ce8\u671f\u7761\u89c9 / \u4f11\u606f\u671f\u6d3b\u52a8\uff0c\u89c1[\u756a\u8304\u949f](/pet/pomodoro.md) | \u4e13\u6ce8\u79bb\u5f00\u3001\u4f11\u606f\u53ef\u56de | \u4f11\u606f\u9636\u6bb5\u6b63\u5e38 |\n\n# \u6301\u4e45\u5316\u4e0e\u54cd\u5e94\u673a\u5236\n\n`mode` \u662f\u76f4\u63a5\u80cc\u4e66 `UserDefaults`\uff08[Settings.petMode](/pet/settings.md)\uff09\u7684\u8ba1\u7b97\u5c5e\u6027\uff0c\u4e0d\u7528 `@Published` \u5b58\u50a8\uff08\u89c4\u907f nonisolated init \u7684\u9694\u79bb\u95ee\u9898\uff09\uff0csetter \u624b\u52a8 `objectWillChange.send()`\u3002[^(mode-src)]\n\n\u6539\u52a8\u6765\u6e90\u6709\u4e24\u79cd\uff1a\u83dc\u5355\u6309\u94ae\uff08\u8d70 setter\uff09\u548c\u5916\u90e8 `defaults write` \u547d\u4ee4\uff08\u7ed5\u8fc7 setter\uff09\u3002\u515c\u5e95\u673a\u5236\uff1a\u4e3b\u5faa\u73af [tick](/pet/pet-view-model.md) \u6bcf\u5e27\u6bd4\u5bf9 `mode != lastReactedMode`\uff0c\u53d1\u73b0\u4e0d\u4e00\u81f4\u7acb\u523b\u8c03 `reactToModeChange()`\u2014\u2014\u4fdd\u8bc1\u65e0\u8bba\u6539\u52a8\u6765\u81ea\u54ea\u91cc\u90fd\u751f\u6548\u3002\n\n`reactToModeChange()` \u7684\u5206\u652f\uff1a\n\n* \u2192 `.working`\uff1a\u505c\u756a\u8304\u949f\u3001\u901a\u77e5\u8c79\u62c9\u79bb\u5f00\u3001\u5192\u6ce1\u300c\u6211\u53bb\u505a\u4e2a\u52c7\u6562\u7684\u68a6\u5566\u300d\u3001`settleIntoCorner()`\u3002\n* \u2192 `.pomodoro`\uff1a`startPomodoro()`\u3002\n* \u2192 `.leisure`\uff1a\u505c\u756a\u8304\u949f\u3001\u5192\u6ce1\u300c\u6211\u9192\u5566\u300d\u3001`stateUntil = Date()` \u7acb\u523b\u6062\u590d\u81ea\u7531\u884c\u4e3a\u3002\n\n\u6700\u540e\u65e0\u6761\u4ef6\u8c03 `configureReminder()`\uff1a\u4f11\u606f\u63d0\u9192\u53ea\u4f3a\u5019\u5de5\u4f5c\u6a21\u5f0f\uff0c\u5207\u5165\u5de5\u4f5c\u4ece\u5934\u8ba1\u65f6\uff0c\u5207\u8d70\u505c\u8868\u3002\u89c1[\u4f11\u606f\u63d0\u9192\u4e0e\u7535\u91cf\u611f\u77e5](/pet/reminder-battery.md)\u3002\n\n# \u5b89\u9759\u671f\uff08isPeaceful\uff09\n\n```swift\nvar isPeaceful: Bool {\n    switch mode {\n    case .leisure: return false\n    case .working: return true\n    case .pomodoro: return pomodoroPhase == .focus\n    }\n}\n```\n\n\u300c\u5b89\u9759\u671f\u300d\u662f\u5168\u5e94\u7528\u7684\u884c\u4e3a\u603b\u5f00\u5173\uff1a\u4e91\u96c0 / \u86c7 / \u72fc\u5f69\u86cb\u4e0d\u89e6\u53d1\u3001\u6233\u4e00\u6233\u53ea\u8ff7\u7cca\u5e94\u4e00\u58f0\u3001\u6f2b\u6e38\u505c\u6b62\u3001\u68a6\u8bdd\u4e0e\u68a6\u5230\u5988\u5988\u539f\u58f0\u4e0d\u64ad\u653e\u3002\u756a\u8304\u949f\u53ea\u6709\u4e13\u6ce8\u671f\u7b97\u5b89\u9759\uff0c\u4f11\u606f\u671f\u4e0d\u5b89\u9759\u3002\n\n# \u89d2\u843d\u5f52\u5bbf\uff08settleIntoCorner\uff09\n\n\u5b89\u9759\u671f\u7684\u5f52\u5bbf\u662f\u5c4f\u5e55\u53f3\u4e0b\u89d2\uff1a`cornerX = visibleFrame.maxX - \u7a97\u53e3\u5bbd - 30`\uff1b\u79bb\u89d2\u843d\u8d85\u8fc7 40pt \u5c31\u8fdb\u5165 `.walkingToSleep(cornerX)`\uff081.2 \u500d\u901f\u8d70\u8fc7\u53bb\uff0c`stateUntil` 30 \u79d2\u515c\u5e95\uff09\uff0c\u5230\u4f4d\u540e `setState(.sleeping, duration: 3600)` \u957f\u7761\uff0c\u7531\u756a\u8304\u949f\u6216\u63d0\u9192\u673a\u5236\u63a5\u7ba1\u540e\u7eed\u3002\n\n[^mode-src]: PetViewModel+Mode.swift\n[^settings-src]: Settings.swift", "overview/product-overview": "# \u5b9a\u4f4d\n\n\u4e00\u53ea\u4f4f\u5728 macOS \u684c\u9762\u4e0a\u7684 Q \u7248\u5c0f\u725b\uff0c\u7075\u611f\u6765\u81ea\u52a8\u753b\u7535\u5f71\u300a\u725b\u6765\u300b\u2014\u2014\u90a3\u53ea\u4ece\u80c6\u5c0f\u5230\u52c7\u6562\u3001\u6700\u7ec8\u7ad9\u8d77\u6765\u8ffd\u4e0a\u725b\u7fa4\u7684\u5c0f\u725b\u3002\u5f62\u8c61\u4e3a\u539f\u521b\u5361\u901a\u5c0f\u725b\uff0c\u4ec5\u81f4\u656c\u7535\u5f71\u89d2\u8272\u6c14\u8d28\uff0c\u4e0d\u6d89\u53ca\u7535\u5f71\u7d20\u6750\u7248\u6743\u3002\n\n\u6280\u672f\u7279\u5f81\uff1amacOS \u539f\u751f\uff08SwiftUI + AppKit \u6df7\u5408\uff09\uff0cSwiftPM \u5355\u6a21\u5757\uff0c\u5f62\u8c61\u5168\u90e8\u7528 SwiftUI Canvas \u7eaf\u4ee3\u7801\u7ed8\u5236\uff0c\u65e0\u5916\u90e8\u7d20\u6750\uff1b\u6253\u5305\u540e\u65e0 Dock \u56fe\u6807\uff08`LSUIElement`\uff09\u3002\u89c1[\u67b6\u6784\u603b\u89c8](/overview/architecture.md)\u3002\n\n# \u529f\u80fd\u6e05\u5355\n\n## \u6838\u5fc3\u884c\u4e3a\n\n* **\u5f00\u573a\u547c\u5524**\uff1a\u542f\u52a8\u65f6\u725b\u6765\u558a\u300c\u5988\u5988\u2014\u2014\uff01\u300d\uff08\u6c14\u6ce1 + \u7535\u5f71\u539f\u58f0\uff09\uff0c\u505c\u4e00\u62cd\u540e\u8fdc\u5904\u4f20\u6765\u725b\u5988\u5988\u56de\u5e94\u300c\u725b\u6765\u2014\u2014\uff01\u300d\uff08\u53ea\u95fb\u5176\u58f0\uff09\u3002\u8be6\u89c1[\u5f00\u573a\u547c\u5524](/pet/opening-call.md)\u3002\n* **\u7075\u52a8\u773c\u795e**\uff1a\u77b3\u5b54\u4f1a\u770b\u4eba\u2014\u2014\u8ffd\u8774\u8776\u76ef\u7740\u8774\u8776\u3001\u88ab\u62ce\u7740\u770b\u9f20\u6807\u3001\u95f2\u65f6\u5077\u779f\u9f20\u6807\uff1b\u8c79\u62c9\u5e73\u65f6\u671b\u725b\u6765\u3001\u72fc\u6765\u4e86\u8f6c\u800c\u76ef\u72fc\uff1b\u88ab\u8ffd\u7684\u8774\u8776\u77b3\u5b54\u6536\u7f29\u56de\u5934\u779f\u3002\u56db\u4e2a\u89d2\u8272\u6309\u4e0d\u540c seed \u7684\u786e\u5b9a\u6027\u4f2a\u968f\u673a\u8282\u594f\u7728\u773c\uff08\u89c1 [EyeBlink](/core/eye-blink.md)\uff09\u3002\n* **\u62d6\u62fd**\uff1a\u6309\u4f4f\u62ce\u8d77\u6765\u653e\u5230\u4efb\u4f55\u5730\u65b9\uff08\u88ab\u62ce\u7740\u4e3e\u53cc\u624b\u6643\u8361\uff09\uff0c\u653e\u4e0b\u5f00\u5fc3\u843d\u5730\u3002\n* **\u70b9\u51fb\u4e92\u52a8**\uff1a\u6233\u4e00\u4e0b\u8df3\u8d77\u6765\u5192\u7535\u5f71\u53f0\u8bcd\u6c14\u6ce1\uff1b\u5b89\u9759\u671f\u88ab\u6233\u53ea\u8ff7\u7cca\u5e94\u4e00\u58f0\u3002\u89c1[\u6838\u5fc3\u72b6\u6001\u673a](/pet/pet-view-model.md)\u3002\n\n## \u4e09\u79cd\u6a21\u5f0f\n\n* \ud83c\udf88 **\u4f11\u95f2**\uff1a\u6ee1\u5730\u6f2b\u6e38\u3001\u53d1\u5446\u3001\u5750\u4e0b\u3001\u6253\u76f9\u3001\u8f6c\u5708\u8ffd\u5c3e\u5df4\u3001\u9876\u5c4f\u5e55\u8fb9\u7f18\u649e\u6655\u81ea\u5df1\u3002\n* \ud83d\udca4 **\u5de5\u4f5c\uff08\u68a6\u5883\uff09**\uff1a\u8d70\u5230\u5c4f\u5e55\u89d2\u843d\u8db4\u4e0b\u505a\u68a6\uff0c\u5076\u5c14\u8bf4\u68a6\u8bdd\uff1b\u4f11\u606f\u63d0\u9192\u7167\u5e38\u3002\n* \ud83c\udf45 **\u756a\u8304\u949f**\uff1a25 \u5206\u949f\u4e13\u6ce8\uff08\u8db4\u89d2\u843d\u505a\u68a6\u966a\uff09\u2192 5 \u5206\u949f\u4f11\u606f\u5faa\u73af\uff0c\u6bcf 4 \u8f6e\u4e00\u6b21 15 \u5206\u949f\u957f\u4f11\u606f\uff1b\u83dc\u5355\u680f\u56fe\u6807\u663e\u793a\u9636\u6bb5\uff0c\u4e13\u6ce8\u4e2d\u6233\u4e00\u4e0b\u4f1a\u8ff7\u7cca\u62a5\u65f6\u3002\u8be6\u89c1[\u756a\u8304\u949f](/pet/pomodoro.md)\u3002\n\n\u6a21\u5f0f\u7cfb\u7edf\u8be6\u89c1[\u4e09\u6a21\u5f0f\u7cfb\u7edf](/overview/mode-system.md)\u3002\n\n## \u5f69\u86cb\u89d2\u8272\n\n* **\u8c79\u62c9\u5ba2\u4e32**\uff1a\u9ec4\u5e95\u9ed1\u6591\u5c0f\u8c79\uff0c\u725b\u6765\u6563\u6b65\u65f6 30% \u6982\u7387\u8dd1\u6765\u8ddf\u968f\uff1b\u300c\u8c79\u62c9\u5e38\u4f34\u300d\u9ed8\u8ba4\u5f00\u542f\uff1b\u72fc\u6765\u4e86\u4f1a\u51b2\u5230\u725b\u6765\u8eab\u524d\u62a4\u536b\u3002\u89c1[\u8c79\u62c9\u63a7\u5236\u5668](/controllers/companion-controller.md)\u3002\n* **\u4e91\u96c0\u98de\u8fc7**\uff1a\u7fc5\u8180\u53d7\u4f24\u7684\u4e91\u96c0\u6bcf\u9694\u51e0\u5206\u949f\u6162\u901f\u98de\u8fc7\uff0c30% \u6982\u7387\u843d\u5728\u725b\u6765\u5934\u9876\u6b47\u811a\u3002\u89c1[\u4e91\u96c0\u63a7\u5236\u5668](/controllers/lark-controller.md)\u3002\n* **\u9752\u86c7\u722c\u8fc7**\uff1a\u5410\u4fe1\u5b50\u7684\u9752\u86c7\u873f\u8712\u722c\u8fc7\uff0c\u725b\u6765\u5413\u4e00\u8df3\uff0c\u722c\u8d70\u540e\u677e\u53e3\u6c14\u3002\n* **\u72fc\u5f71\u63a0\u8fc7**\uff1a\u7070\u72fc\u98de\u5954\u6a2a\u7a7f\uff0c\u725b\u6765\u5413\u5f97\u8fde\u8df3\uff1b\u8c79\u62c9\u5728\u573a\u65f6\u62a4\u536b\uff0c\u72fc\u8dd1\u6389\u540e\u9053\u8c22\u3002\u86c7\u548c\u72fc\u4e92\u65a5\uff0c\u90fd\u53ef\u80fd\u4ece\u5de6\u6216\u53f3\u51fa\u573a\u3002\u89c1[\u5f69\u86cb\u8c03\u5ea6](/pet/events-scheduler.md)\u3002\n* **\u8ffd\u8774\u8776**\uff1a\u5c0f\u8dd1\u8ffd\u8774\u8776\uff08\u300c\u8774\u8776\uff01\u7b49\u7b49\u6211\uff01\u300d\uff09\uff0c\u88ab\u8ffd\u7684\u8774\u8776\u52a0\u901f\u7529\u5f00\uff1b\u5feb\u98de\u51fa\u5c4f\u5e55\u65f6\u8df3\u8d77\u6765\u6251\u2014\u2014\u591a\u534a\u6251\u7a7a\u3002\u89c1[\u8774\u8776\u63a7\u5236\u5668](/controllers/butterfly-controller.md)\u3002\n\n## \u751f\u6d3b\u7cfb\u7edf\n\n* **\u68a6\u8bdd\u5f69\u86cb**\uff1a\u6253\u76f9\u5076\u5c14\u5192\u68a6\u8bdd\uff1b\u4f11\u95f2\u6a21\u5f0f\u6253\u76f9\u7ea6 1/4 \u6982\u7387\u300c\u68a6\u5230\u5988\u5988\u300d\uff0c\u7761\u5230\u4e2d\u9014\u4f4e\u97f3\u91cf\u64ad\u653e\u7535\u5f71\u300c\u5988\u5988\u300d\u5462\u5583\u539f\u58f0\uff08\u4e00\u89c9\u6700\u591a\u4e00\u6b21\uff1b\u5de5\u4f5c / \u756a\u8304\u949f\u7684\u7761\u7edd\u4e0d\u64ad\u653e\uff09\u3002\n* **\u756a\u8304\u949f\u63d0\u793a\u97f3**\uff1a\u9636\u6bb5\u5207\u6362\u64ad\u653e\u7535\u5f71\u300c\u725b\u6765\uff01\u300d\u547c\u5524\u3002\n* **\u7761\u9192\u4f38\u61d2\u8170**\uff1a\u6253\u54c8\u6b20 + \u53cc\u81c2\u4e0a\u4e3e\u62c9\u4f38\u7684\u7f16\u6392\u52a8\u753b\u3002\n* **\u9876\u5c4f\u5e55\u8fb9\u7f18**\uff1a\u8d70\u5230\u8fb9\u7f18 30% \u6982\u7387\u4f4e\u5934\u9876\u5899\uff0c\u628a\u81ea\u5df1\u9876\u6655\uff08\u87ba\u65cb\u773c + \ud83d\udcab\uff09\u3002\n* **\u7535\u91cf\u611f\u77e5**\uff1a\u63d2\u4e0a\u7535\u6e90\u5f00\u5fc3\uff08\u300c\u6765\u7535\u5566\uff01\u26a1\u300d\uff09\uff1b\u7535\u91cf \u226420% \u672a\u5145\u7535\u63d0\u9192\u5145\u7535\uff0c\u81ea\u5df1\u6ca1\u7cbe\u6253\u91c7\u5750\u4e0b\u3002\u89c1[\u4f11\u606f\u63d0\u9192\u4e0e\u7535\u91cf\u611f\u77e5](/pet/reminder-battery.md)\u3002\n* **\u4f11\u606f\u63d0\u9192**\uff08\u4ec5\u5de5\u4f5c\u6a21\u5f0f\uff09\uff1a\u5b9a\u65f6\u8d70\u5230\u5c4f\u5e55\u4e2d\u95f4\u63d0\u9192\u8d77\u6765\u6d3b\u52a8\uff0c\u9ed8\u8ba4 45 \u5206\u949f\u53ef\u5173\u3002\n\n# \u6f14\u793a\u6a21\u5f0f\n\n\u542f\u52a8\u53c2\u6570 `--demo` \u8fdb\u5165\u6f14\u793a\u8282\u594f\uff1a8 \u79d2\u6765\u86c7\u300115 \u79d2\u6765\u8774\u8776\u300130 \u79d2\u6765\u72fc\uff1b\u756a\u8304\u949f 30 \u79d2\u4e13\u6ce8 / 15 \u79d2\u4f11\u606f / 45 \u79d2\u957f\u4f11\uff1b\u4e91\u96c0 5 \u79d2\u5c31\u98de\u4e14\u5fc5\u5b9a\u6b47\u811a\uff08\u51fa\u98de\u540e 30 \u79d2\u6392\u4e0b\u4e00\u73ed\uff09\u3002\u65b9\u4fbf\u8c03\u8bd5\u4e0e\u5f55\u5c4f\u3002[^(events-src)]\n\n# \u53f0\u8bcd\n\n\u5168\u90e8\u53f0\u8bcd\u96c6\u4e2d\u5728[\u53f0\u8bcd\u5e93](/pet/pet-phrases.md)\uff0c\u53d6\u6750\u7535\u5f71\u60c5\u8282\uff08\u725b\u4e8c\u3001\u4e03\u5929\u7ad9\u8d77\u6765\u3001\u8c79\u62c9\u662f\u670b\u53cb\u7b49\uff09\u3002", "pet/events-scheduler": "# \u51fa\u573a\u95f4\u9694\n\n\u7531 5s \u7684 [eventTicker](/core/frame-ticker.md) \u8f6e\u8be2 `checkEvents()`\uff0c\u5230\u70b9\u5373\u89e6\u53d1\uff08\u5747\u968f\u673a\u533a\u95 0855px/s\uff0c\u649e\u8fb9\u68c0\u6d4b\u542b\u9876\u5899\uff09\u3001`walkingTo`\uff081.6 \u500d\u901f\uff0c\u8ddd\u76ee\u6807 <24px \u5230\u8fbe\uff09\u3001`walkingToSleep`\uff081.2 \u500d\u901f\uff09\u3001`chasing`\uff082.2 \u500d\u901f\u5c0f\u8dd1\uff0c\u8774\u8776\u6ca1\u4e86 / \u8ddd\u79bb >420px \u653e\u5f03\uff1b\u8ddd\u8774\u8776 <24px \u6b7b\u533a\u5185\u4e0d\u6a2a\u8df3\u9632\u7ffb\u8f6c\u95ea\u70c1\uff09\u3001`pouncing`\uff08\u5411\u524d 35px/s \u5c0f\u8df3\uff09\u3002\n3. **\u72b6\u6001\u5230\u70b9**\uff08`now >= stateUntil` \u4e14\u975e dragged\uff09\uff1a`sleeping` \u2192 60% \u4f38\u61d2\u8170\uff082.8s\uff09\u5426\u5219 `pickNextState`\uff1b`spinning` \u2192 \u5750\u4e0b 3-6s\uff1b`headbutting` \u2192 `dizzy` 1.8s\uff1b`dizzy` \u2192 \u6389\u5934\u8d70\u8def\uff1b`pouncing` \u2192 \u6251\u7a7a\u300c\u563f\u563f\u2026\u2026\u5dee\u70b9\u5c31\u6293\u5230\u4e86\u300d\uff1b`chasing` \u2192 `butterflyGone()`\u3002\n4. **\u68a6\u5230\u5988\u5988**\uff1a`mamaDreamArmed` \u7684\u89c9\u7761\u8fc7 1.2s \u4e14\u6c14\u6ce1\u7a7a\u95f2 \u2192 \u300c\uff08\u68a6\u8bdd\uff09\u5988\u5988\uff0c\u5feb\u8dd1\u2026\u2026\u300d+ mama \u539f\u58f0 0.3 \u97f3\u91cf\uff08\u4e00\u89c9\u4e00\u6b21\uff09\u3002\n5. **\u968f\u673a\u68a6\u8bdd**\uff1a\u975e\u756a\u8304\u949f\u7761\u89c9\u65f6\u6bcf\u5e27 1/1200 \u6982\u7387\u5192\u4e00\u53e5[\u68a6\u8bdd](/pet/pet-phrases.md)\u3002\n\n# \u884c\u4e3a\u51b3\u7b56 pickNextState\n\n\u5b89\u9759\u671f\uff08[isPeaceful](/overview/mode-system.md)\uff09\u2192 `settleIntoCorner()`\uff1b\u6f2b\u6e38\u5173\u95ed \u2192 \u5750 60s\u3002\u5426\u5219\u6309\u6743\u91cd\u6c60\u52a0\u6743\u968f\u673a\uff1a\n\n| \u72b6\u6001 | idle | walking | sitting | sleeping | spinning |\n|------|------|---------|---------|----------|----------|\n| \u6743\u91cd | 3 | 3.5 | 2 | 1 | 0.7 |\n\nwalking \u6301\u7eed 5-12s \u968f\u673a\u65b9\u5411\uff1bspinning \u56fa\u5b9a 1.6s\uff1b\u5176\u4f59 4-9s\u3002\n\n# \u79fb\u52a8\u4e0e\u649e\u8fb9\n\n* `move(dx:)`\uff1a\u5 ew": "\u56fe\u6807\u662f `MenuBarLabelView` \u76f4\u63a5\u663e\u793a `pet.menuBarLabel` \u6587\u672c\uff08\ud83d\udc2e / \ud83d\udc2e\ud83c\udf45 / \ud83d\udc2e\u2615\ufe0f / \ud83d\udc2e \u23f8\uff09\u3002[^(app-src)]\n\n# \u83dc\u5355\u9879\uff08\u81ea\u4e0a\u800c\u4e0b\uff09[^(menu-src)]\n\n1. **\u6a21\u5f0f**\uff1a\u4f11\u95f2 / \u5de5\u4f5c / \u756a\u8304\u949f\u4e09\u4e2a\u6309\u94ae\uff0c\u5f53\u524d\u6a21\u5f0f\u5e26 \u2713 \u56fe\u6807\u3002\u26a0\ufe0f \u5b9e\u73b0\u6ce8\u8bb0\uff1a\u539f\u6765\u7528 Picker\uff0c\u4f46 Picker \u5728 menu \u6837\u5f0f\u7684 MenuBarExtra \u91cc\u9009\u62e9\u4e0d\u751f\u6548\uff0c\u6362\u6210\u6309\u94ae\u7ec4\u3002\n2. **\u756a\u8304\u949f\u533a**\uff08\u4ec5\u756a\u8304\u949f\u6a21\u5f0f\u663e\u793a\uff09\uff1a\u9636\u6bb5 + \u5206\u949f\u7ea7\u5012\u8ba1\u65f6\u6587\u672c\u3001\u6682\u505c / \u7ee7\u7eed\u3001\u63d0\u524d\u5207\u6362\u9636\u6bb5\uff08\u89c1[\u756a\u8304\u949f](/pet/pomodoro.md)\uff09\u3002\n3. **\u9690\u85cf / \u663e\u793a\u725b\u6765** \u2192 `setVisible`\u3002\n4. **Toggle \u4e09\u8fde**\uff1a\u81ea\u7531\u8d70\u52a8\uff08\u2192 `applyRoaming`\uff09\u3001\u8c79\u62c9\u5e38\u4f34\uff08\u2192 `companion.setAlways`\uff09\u3001\u97f3\u6548\uff08\u2192 \u76f4\u63a5\u5199 [Settings](/pet/settings.md)\uff0cSoundPlayer \u8bfb\uff09\u3002\n5. **\u4f11\u606f\u63d0\u9192 Picker**\uff1a\u5173\u95ed / 30 / 45 / 60 \u5206\u949f\uff08\u4ec5\u5de5\u4f5c\u6a21\u5f0f\u751f\u6548\uff0c\u2192 `configureReminder`\uff09\u3002\n6. **\u6233\u4e00\u4e0b\u725b\u6765** \u2192 `poke()`\u3002\n7. **\u9000\u51fa\u725b\u6765**\uff08\u2318Q\uff09\u3002\n\n\u56db\u4e2a\u504f\u597d\u9879\u7528 `@AppStorage(Settings.Key.xxx)` \u53cc\u5411\u7ed1\u5b9a UserDefaults\uff0c`onChange` \u91cc\u8c03\u7528 viewModel \u7684\u5bf9\u5e94\u65b9\u6cd5\u3002\n\n[^menu-src]: MenuBarContentView.swift\n[^app-src]: NiulaiApp.swift\uff08MenuBarExtra \u88c5\u914d\uff09", "views/niulai-view": "\u5171\u901a\u753b\u6cd5\u89c1[\u7ed8\u5236\u7ea6\u5b9a](/views/drawing-conventions.md)\u3002\u672c\u89c6\u56fe\u7684\u72ec\u6709\u70b9\uff1a[^(niulai-view)]\n\n* **\u5f62\u8c61**\uff1a\u7535\u5f71\u76f4\u7acb\u7248\u2014\u2014\u6b63\u9762\u89c6\u89d2\u3001\u6a59\u9ec4\u8eab\u4f53\u3001\u6807\u5fd7\u6027\u7070\u767d\u5927\u5634\u5957\u3001\u7ec6\u7709\u8037\u62c9\u773c\u7684\u4e27\u840c\u8868\u60c5\u3002\u5168\u90e8 `Canvas` path \u624b\u7ed8\uff0c\u65e0\u56fe\u7247\u7d20\u6750\u3002\n* **`AnimationParams`**\uff1a\u6309 15 \u4e2a [State](/pet/pet-view-model.md) \u9010\u4e2a\u7f16\u6392\uff08squashX/Y \u6324\u538b\u62c9\u4f38\u3001tilt/lean \u503e\u659c\u3001buttLunge \u8d77\u8df3\u51b2\u91cf\u3001lift\u3001spinFlip\u2026\u2026\uff09\uff0c`chasing` / `walking` \u7b49\u8fd0\u52a8\u72b6\u6001\u53e0\u52a0\u6b65\u4f10\u6446\u52a8\u3002\n* **\u77b3\u5b54**\uff1a`pupilOffset()` \u6309\u72b6\u6001\u51b3\u5b9a\u89c6\u7ebf\u2014\u2014\u8ffd\u8774\u8776\u76ef\u7740\u8774\u8776\u3001\u88ab\u62ce\u770b\u9f20\u6807\uff08`NSEvent.mouseLocation` \u6362\u7b97\uff09\u3001`idle` \u5077\u779f\u9f20\u6807\u3001\u8d70\u8def\u770b\u524d\u65b9\u3002\n* **\u72b6\u6001\u5fbd\u6807**\uff1a`sleeping` \u5934\u9876\u6f02\u6d6e \ud83d\udca4\uff08\u6b63\u5f26\u6d6e\u52a8 + \u534a\u900f\u660e\uff09\uff0c`dizzy` \u5934\u9876 \ud83d\udcab\u3002\n* **\u5bb9\u5668**\uff1a\u753b\u5e03 240\u00d7230\uff0c\u951a\u5b9a\u5728 240\u00d7300 \u7a97\u53e3\u5e95\u90e8\uff08\u4e0a\u65b9 70pt \u7559\u7ed9[\u6c14\u6ce1](/views/speech-bubble-view.md)\uff09\u3002\n\n[^niulai-view]: NiulaiView.swift\n[^container-src]: PetContainerView.swift\uff08\u627f\u8f7d\u4e0e\u624b\u52bf\uff09", "views/pet-container-view": "\u5e03\u5c40\u4e09\u5c42\uff08\u81ea\u4e0b\u800c\u4e0a\uff09\uff1a[NiulaiView](/views/niulai-view.md)\uff08240\u00d7230\uff0c\u951a\u5e95\uff09\u2192 `.frame(240\u00d7300, alignment: .bottom)` \u2192 `.overlay(alignment: .top)` \u653e[\u6c14\u6ce1](/views/speech-bubble-view.md)\u3002[^(container-src)]\n\n# \u624b\u52bf\n\n* **\u70b9\u51fb** `onTapGesture` \u2192 `viewModel.poke()`\uff08\u5206\u652f\u903b\u8f91\u89c1[\u6838\u5fc3\u72b6\u6001\u673a](/pet/pet-view-model.md)\uff09\u3002\n* **\u62d6\u62fd** `DragGesture(minimumDistance: 3)`\uff1a`onChanged` \u91cc\u628a\u7a97\u53e3 origin \u8bbe\u4e3a\u9f20\u6807\u4f4d\u7f6e\u51cf\u53bb `grabOffset`\uff08\u6309\u4e0b\u65f6\u8bb0\u5f55\u7684\u6293\u53d6\u504f\u79fb\uff09\uff0c\u5e76 `beginDrag()`\uff1b`onEnded` \u2192 `endDrag()` \u5f00\u5fc3\u843d\u5730\u3002\u76f4\u63a5\u6539 `NSWindow.setFrameOrigin`\uff0c\u4e0d\u8d70\u72b6\u6001\u673a\u79fb\u52a8\u903b\u8f91\u3002\n* \u6c14\u6ce1 `allowsHitTesting(false)`\u2014\u2014\u51fa\u73b0 / \u6d88\u5931\u65f6\u725b\u6765\u539f\u5730\u4e0d\u52a8\uff0c\u4e5f\u4e0d\u6321\u624b\u52bf\u3002\n\n[^container-src]: PetContainerView.swift\n[^vm-src]: PetViewModel\uff08poke / beginDrag / endDrag\uff09", "views/speech-bubble-view": "* \u7eaf\u5c55\u793a\u7ec4\u4ef6\uff1a`text: String?`\uff0cnil \u65f6\u4e0d\u5360\u89c6\u89c9\uff1b13pt \u6df1\u68d5\u6587\u5b57\uff0c\u6700\u591a 3 \u884c\uff0c\u5c45\u4e2d\u3002[^(bubble-src)]\n* \u5e95\u8272\u5976\u9ec4 `(1.0, 0.98, 0.92)`\uff0c\u5706\u89d2 14 + \u8f7b\u6295\u5f71\uff1b`BubbleTail` \u81ea\u5b9a\u4e49 Shape \u753b\u5c0f\u4e09\u89d2\uff0c`offset(x: 40)` \u6307\u5411\u725b\u6765\u7684\u5934\u3002\n* \u8f6c\u573a\uff1a`scale(0.5, anchor: .bottom)` + `opacity`\uff0cspring\uff08response 0.3, damping 0.7\uff09\u3002\n* \u6587\u672c\u5185\u5bb9\u4e0e\u663e\u9690\u65f6\u957f\u7531\u5404\u5904\u7684 `showBubble` \u63a7\u5236\uff08[\u725b\u6765](/pet/pet-view-model.md)\u4e0e[\u8c79\u62c9](/controllers/companion-controller.md)\u5404\u6709\u4e00\u5957 generation \u9632\u7ade\u6001\u673a\u5236\uff09\uff1b\u8c79\u62c9\u7a97\u53e3\u590d\u7528\u540c\u4e00\u89c6\u56fe\u3002\n\n[^bubble-src]: SpeechBubbleView.swift\n[^comp-src]: CompanionController\uff08\u8c79\u62c9\u590d\u7528\uff09"}, "types": ["Architecture", "Asset", "Base Class", "Component", "Concept", "Config", "Content Library", "Convention", "Feature", "Module", "Overview" (function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
